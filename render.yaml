# Render blueprint: New → Blueprint → pick this repo. Secrets marked `sync: false` are asked for on first deploy.
# Database: create a free Neon project and paste its connection string as DATABASE_URL (pgvector is enabled by the
# first migration). Files: an Amazon S3 bucket (Render's disk is wiped on every deploy); STORAGE=r2 also works.
services:
  - type: web
    name: clientdesk-mcp
    runtime: docker
    plan: free # sleeps when idle; use starter (~$7/month) to keep it awake for demos
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: oauth
      - key: PUBLIC_URL
        sync: false # https://clientdesk-mcp.onrender.com (or your custom domain)
      - key: OAUTH_ISSUER
        sync: false # https://<subdomain>.authkit.app
      - key: OAUTH_AUDIENCE
        sync: false # optional; defaults to PUBLIC_URL + /mcp
      - key: OAUTH_EMAIL_CLAIM
        value: email
      - key: DASHBOARD_CLIENT_ID
        sync: false
      - key: DASHBOARD_CLIENT_SECRET
        sync: false
      - key: DEMO_LOGIN
        value: 'true' # "Try the demo" on the sign-in page: a read-only, partner-level session (rate-limited)
      - key: TRUST_PROXY
        value: '1' # Render's proxy sits in front: the demo rate limit then sees the visitor's IP
      - key: SESSION_SECRET
        generateValue: true
      - key: LINK_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Neon connection string, postgres://...?sslmode=require
      - key: ANTHROPIC_API_KEY
        sync: false # optional; leave blank to use Groq
      - key: GROQ_API_KEY
        sync: false # free extractor (console.groq.com); used when ANTHROPIC_API_KEY is blank
      - key: VOYAGE_API_KEY
        sync: false # optional; blank uses the built-in local embeddings
      - key: STORAGE
        value: s3
      - key: S3_BUCKET
        sync: false # bucket names are global, e.g. clientdesk-documents-yourname
      - key: S3_REGION
        sync: false # the bucket's region, e.g. us-west-2 (`npm run storage:check` tells you if it's wrong)
      - key: AWS_ACCESS_KEY_ID
        sync: false # an IAM user allowed to read and write this one bucket only
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SEED_DEMO
        value: '1'
